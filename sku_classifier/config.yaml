dataset:
  split:
    train: 0.70
    val: 0.15
    test: 0.15
  split_seed: 42

experiment:
  negative_class_name: GENERAL_SKU_SINGLE
  negative_class_ids: []
  negative_iou_threshold: 0.3
  negative_fractions: [0.10, 0.20, 0.50, 1.00]
  max_train_positive_per_class:

label_smoothing: 0.1

input:
  sizes: [56, 112, 224]
  min_size: 4
  context_margin: 0.0
  pad_color: 114

sampling:
  pos_neg_ratio: "1:1"

model:
  backbone: mobilenetv4_conv_medium.e500_r224_in1k
  pretrained: true
  head:
    global_pool: avg
    dropout: 0.3
  num_classes: 1

training:
  epochs: 50
  batch_size: 32
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.01
  device: auto
  num_workers: 0

loss:
  type: focal
  class_pos_weight:
    enabled: true
    strategy: inv_sqrt
    max_weight: 10.0
  focal:
    alpha: 0.25
    gamma: 2.0

threshold: 0.5

metrics:
  evaluate_dynamic_scale: true
  macro_min_support: 5
  tune_thresholds:
    enabled: true
    candidates: [0.10, 0.30, 0.50, 0.70, 0.90]

logging:
  run_dir: runs
  per_class_interval: 5
